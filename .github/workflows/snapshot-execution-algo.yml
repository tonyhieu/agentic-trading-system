name: Create Execution Algorithm Snapshot

on:
  push:
    branches:
      - 'snapshots/**'
  workflow_dispatch:
    inputs:
      algo_name:
        description: 'Name of the execution algorithm'
        required: true
        type: string
      algo_path:
        description: 'Path to algorithm files'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-snapshot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Generate metadata
        id: meta
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.algo_name }}" >> $GITHUB_OUTPUT
            echo "path=${{ github.event.inputs.algo_path }}" >> $GITHUB_OUTPUT
          else
            NAME="${{ github.ref_name }}"
            NAME="${NAME#snapshots/}"
            echo "name=$NAME" >> $GITHUB_OUTPUT
            echo "path=execution_algos/$NAME" >> $GITHUB_OUTPUT
          fi
      
      - name: Verify algorithm
        run: |
          if [ ! -d "${{ steps.meta.outputs.path }}" ]; then
            echo "Error: Algorithm not found at ${{ steps.meta.outputs.path }}"
            exit 1
          fi
          echo "Algorithm verified"
      
      - name: Create snapshot
        run: |
          DIR="${{ steps.meta.outputs.timestamp }}-${{ steps.meta.outputs.commit }}"
          ROOT="snapshot-temp/${{ steps.meta.outputs.name }}/${DIR}"
          mkdir -p "$ROOT/code" "$ROOT/results"
          find "${{ steps.meta.outputs.path }}" -maxdepth 1 -name "*.py" -exec cp {} "$ROOT/code/" \; 2>/dev/null || true
          find "${{ steps.meta.outputs.path }}" -maxdepth 1 -name "*.ipynb" -exec cp {} "$ROOT/code/" \; 2>/dev/null || true
          [ -f "${{ steps.meta.outputs.path }}/requirements.txt" ] && cp "${{ steps.meta.outputs.path }}/requirements.txt" "$ROOT/code/" || true
          [ -d "${{ steps.meta.outputs.path }}/results" ] && find "${{ steps.meta.outputs.path }}/results" -type f -exec cp {} "$ROOT/results/" \; 2>/dev/null || true
          if [ -f "${{ steps.meta.outputs.path }}/NOTES.md" ]; then
            cp "${{ steps.meta.outputs.path }}/NOTES.md" "$ROOT/"
          else
            echo "Warning: No NOTES.md found in ${{ steps.meta.outputs.path }} — snapshot will not include agent reasoning"
          fi
          echo "ROOT=$ROOT" >> $GITHUB_ENV
      
      - name: Create metadata
        env:
          ALGO_NAME: ${{ steps.meta.outputs.name }}
          TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit }}
          COMMIT_SHA_FULL: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          TRIGGERED_BY: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Writing metadata.json into $ROOT"
          mkdir -p "$ROOT"
          printf '%s\n' "{" \
            "  \"algo_name\": \"${ALGO_NAME}\"," \
            "  \"timestamp\": \"${TIMESTAMP}\"," \
            "  \"commit_short\": \"${COMMIT_SHA}\"," \
            "  \"commit_full\": \"${COMMIT_SHA_FULL}\"," \
            "  \"branch\": \"${BRANCH}\"," \
            "  \"repository\": \"${REPOSITORY}\"," \
            "  \"triggered_by\": \"${TRIGGERED_BY}\"," \
            "  \"actor\": \"${ACTOR}\"," \
            "  \"run_id\": \"${RUN_ID}\"" \
            "}" > "$ROOT/metadata.json"
          echo "Wrote $ROOT/metadata.json"
      
      - name: Display snapshot
        run: |
          echo "Snapshot contents:"
          find "$ROOT" -type f
          du -sh "$ROOT"
      
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Upload to S3
        run: |
          S3="s3://${{ secrets.S3_BUCKET_NAME }}/execution_algos/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.timestamp }}-${{ steps.meta.outputs.commit }}/"
          echo "Uploading to $S3"
          aws s3 sync "$ROOT/" "$S3" --storage-class STANDARD --no-progress
          echo "Upload complete"

      - name: Invoke evaluator
        env:
          EVALUATOR_FUNCTION_NAME: execution-algorithm-evaluator
          LAMBDA_REGION: us-east-1
          ALGO_NAME: ${{ steps.meta.outputs.name }}
        run: |
          PAYLOAD_FILE="$(mktemp)"
          RESPONSE_FILE="$(mktemp)"
          printf '{"execution_algorithm_name":"%s"}' "$ALGO_NAME" > "$PAYLOAD_FILE"
          echo "Invoking ${EVALUATOR_FUNCTION_NAME} in ${LAMBDA_REGION} for ${ALGO_NAME}"
          aws lambda invoke \
            --function-name "${EVALUATOR_FUNCTION_NAME}" \
            --region "${LAMBDA_REGION}" \
            --cli-binary-format raw-in-base64-out \
            --payload "file://${PAYLOAD_FILE}" \
            "$RESPONSE_FILE" \
            >/tmp/evaluator-invoke-metadata.json
          cat "$RESPONSE_FILE"
          STATUS_CODE=$(jq -r '.statusCode' "$RESPONSE_FILE")
          if [ "$STATUS_CODE" != "200" ]; then
            echo "Lambda returned non-200 statusCode: $STATUS_CODE"
            exit 1
          fi
          REPORT_KEY=$(jq -r '.body | fromjson | .report_key' "$RESPONSE_FILE")
          if [ -z "$REPORT_KEY" ] || [ "$REPORT_KEY" = "null" ]; then
            echo "Lambda response did not include report_key"
            exit 1
          fi
          echo "Lambda report key: ${REPORT_KEY}"
          aws s3 ls "s3://${{ secrets.S3_BUCKET_NAME }}/${REPORT_KEY}" --region "${{ secrets.AWS_REGION }}"
      
      - name: Verify
        run: |
          S3="s3://${{ secrets.S3_BUCKET_NAME }}/execution_algos/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.timestamp }}-${{ steps.meta.outputs.commit }}/"
          aws s3 ls "$S3" --recursive
          if aws s3 ls "${S3}metadata.json" >/dev/null 2>&1; then
            echo "Verified successfully"
          else
            echo "Verification failed"
            exit 1
          fi
      
      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Execution Algorithm: ${{ steps.meta.outputs.name }}"
          echo "Timestamp: ${{ steps.meta.outputs.timestamp }}"
          echo "Status: ${{ job.status }}"
          echo "=========================================="
