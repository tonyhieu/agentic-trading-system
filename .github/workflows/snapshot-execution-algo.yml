name: Create Execution Algorithm Snapshot

on:
  push:
    branches:
      - 'snapshots/**'
  workflow_dispatch:
    inputs:
      algo_name:
        description: 'Name of the execution algorithm'
        required: true
        type: string
      algo_path:
        description: 'Path to algorithm files'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-snapshot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      algo_name: ${{ steps.meta.outputs.name }}
      snapshot_dir: ${{ steps.meta.outputs.timestamp }}-${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Generate metadata
        id: meta
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.algo_name }}" >> $GITHUB_OUTPUT
            echo "path=${{ github.event.inputs.algo_path }}" >> $GITHUB_OUTPUT
          else
            NAME="${{ github.ref_name }}"
            NAME="${NAME#snapshots/}"
            echo "name=$NAME" >> $GITHUB_OUTPUT
            echo "path=execution_algos/$NAME" >> $GITHUB_OUTPUT
          fi
      
      - name: Verify algorithm
        run: |
          if [ ! -d "${{ steps.meta.outputs.path }}" ]; then
            echo "Error: Algorithm not found at ${{ steps.meta.outputs.path }}"
            exit 1
          fi
          echo "Algorithm verified"
      
      - name: Create snapshot
        run: |
          DIR="${{ steps.meta.outputs.timestamp }}-${{ steps.meta.outputs.commit }}"
          ROOT="snapshot-temp/${{ steps.meta.outputs.name }}/${DIR}"
          mkdir -p "$ROOT/code" "$ROOT/results"
          find "${{ steps.meta.outputs.path }}" -maxdepth 1 -name "*.py" -exec cp {} "$ROOT/code/" \; 2>/dev/null || true
          find "${{ steps.meta.outputs.path }}" -maxdepth 1 -name "*.ipynb" -exec cp {} "$ROOT/code/" \; 2>/dev/null || true
          [ -f "${{ steps.meta.outputs.path }}/requirements.txt" ] && cp "${{ steps.meta.outputs.path }}/requirements.txt" "$ROOT/code/" || true
          [ -d "${{ steps.meta.outputs.path }}/results" ] && find "${{ steps.meta.outputs.path }}/results" -type f -exec cp {} "$ROOT/results/" \; 2>/dev/null || true
          if [ -f "${{ steps.meta.outputs.path }}/NOTES.md" ]; then
            cp "${{ steps.meta.outputs.path }}/NOTES.md" "$ROOT/"
          else
            echo "Warning: No NOTES.md found in ${{ steps.meta.outputs.path }} — snapshot will not include agent reasoning"
          fi
          echo "ROOT=$ROOT" >> $GITHUB_ENV
      
      - name: Create metadata
        env:
          ALGO_NAME: ${{ steps.meta.outputs.name }}
          TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit }}
          COMMIT_SHA_FULL: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          TRIGGERED_BY: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Writing metadata.json into $ROOT"
          mkdir -p "$ROOT"
          printf '%s\n' "{" \
            "  \"algo_name\": \"${ALGO_NAME}\"," \
            "  \"timestamp\": \"${TIMESTAMP}\"," \
            "  \"commit_short\": \"${COMMIT_SHA}\"," \
            "  \"commit_full\": \"${COMMIT_SHA_FULL}\"," \
            "  \"branch\": \"${BRANCH}\"," \
            "  \"repository\": \"${REPOSITORY}\"," \
            "  \"triggered_by\": \"${TRIGGERED_BY}\"," \
            "  \"actor\": \"${ACTOR}\"," \
            "  \"run_id\": \"${RUN_ID}\"" \
            "}" > "$ROOT/metadata.json"
          echo "Wrote $ROOT/metadata.json"
      
      - name: Display snapshot
        run: |
          echo "Snapshot contents:"
          find "$ROOT" -type f
          du -sh "$ROOT"
      
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Upload to S3
        run: |
          S3="s3://${{ secrets.S3_BUCKET_NAME }}/execution_algos/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.timestamp }}-${{ steps.meta.outputs.commit }}/"
          echo "Uploading to $S3"
          aws s3 sync "$ROOT/" "$S3" --storage-class STANDARD --no-progress
          echo "Upload complete"

  evaluate-on-ec2:
    needs: create-snapshot
    runs-on: [self-hosted, linux, x64, ec2-evaluator]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ALGO_NAME: ${{ needs.create-snapshot.outputs.algo_name }}
      SNAPSHOT_DIR: ${{ needs.create-snapshot.outputs.snapshot_dir }}
      REPORT_KEY: evaluation_reports/${{ needs.create-snapshot.outputs.algo_name }}/${{ needs.create-snapshot.outputs.snapshot_dir }}.json
      EVALUATION_RUNTIME: ec2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3 requests pandas numpy zstandard nautilus-trader==1.225.0 python-dotenv

      - name: Run evaluator
        run: |
          python3 scripts/local-evaluator.py "$ALGO_NAME" 2 \
            --report-s3-bucket "${{ secrets.S3_BUCKET_NAME }}" \
            --report-s3-key "$REPORT_KEY"

      - name: Verify report in S3
        run: |
          python3 - <<'PY'
          import boto3, os, sys
          s3 = boto3.client("s3", region_name=os.environ["AWS_REGION"])
          try:
              s3.head_object(Bucket=os.environ["S3_BUCKET_NAME"], Key=os.environ["REPORT_KEY"])
          except Exception as e:
              print(f"Verification failed: {e}")
              sys.exit(1)
          print("Verified report exists in S3")
          PY
